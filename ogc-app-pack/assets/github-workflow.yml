# .github/workflows/<algorithm-name>.yml
# On push, builds the image, generates + validates the CWL, commits it back,
# and registers the process with MAAP.
name: ALGORITHM_NAME
on:
  push:
    branches:
      - main
    paths:
      - 'ALGORITHM_DIR/**'
      - '.github/workflows/ALGORITHM_NAME.yml'

jobs:
  generate_app_pack:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # the Action commits the generated CWL back to the branch
      packages: write     # the Action pushes the image to GHCR

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6

      - name: Use OGC App Pack Generator Action
        uses: MAAP-Project/ogc-app-pack-generator@1.1.0
        with:
          algorithm-configuration-path: ALGORITHM_DIR/algorithm_config.yml
          dockerfile-path: ALGORITHM_DIR/Containerfile   # omit if algorithm_container_url is set
          cwl-workflow-dir: ALGORITHM_DIR/cwl_workflows
          deploy-app-pack: true
          # Production (default). For UAT use https://api.uat.maap-project.org/api/ogc/processes
          # and a MAAP_TOKEN issued by the UAT console.
          app-pack-register-endpoint: https://api.maap-project.org/api/ogc/processes
        env:
          # MAAP token is required to deploy the process
          MAAP_TOKEN: ${{ secrets.MAAP_TOKEN }}
